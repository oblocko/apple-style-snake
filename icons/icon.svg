<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- The "bite": cells the snake has eaten out of the apple, on the game's grid -->
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <g fill="#000">
        <rect x="225" y="283" width="62" height="62" rx="21"/>
        <rect x="279" y="283" width="62" height="62" rx="21"/>
        <rect x="333" y="283" width="62" height="62" rx="21"/>
        <rect x="333" y="229" width="62" height="62" rx="21"/>
        <rect x="387" y="229" width="62" height="62" rx="21"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#FFFFFF"/>
  <g transform="translate(-6 -14)">
    <!-- stem and leaf -->
    <path d="M226 170 C 226 150, 230 128, 242 108" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round"/>
    <path d="M246 132 C 262 98, 300 92, 318 100 C 306 126, 276 142, 246 132 Z" fill="#000"/>
    <!-- apple body with the bite taken out -->
    <path mask="url(#bite)" d="M226 172 C 192 146, 112 146, 92 226 C 74 300, 116 418, 178 438 C 202 446, 214 432, 226 432 C 238 432, 250 446, 274 438 C 336 418, 378 300, 360 226 C 340 146, 260 146, 226 172 Z" fill="#000"/>
    <!-- crumbs -->
    <rect x="388" y="352" width="13" height="13" rx="4.5" fill="#000" transform="rotate(18 394 358)"/>
    <rect x="410" y="372" width="9" height="9" rx="3" fill="#000" transform="rotate(-24 414 376)"/>
    <!-- snake in the bite: tail deep inside, head out past the edge -->
    <rect x="232" y="290" width="48" height="48" rx="16" fill="#30D158" opacity=".7"/>
    <rect x="286" y="290" width="48" height="48" rx="16" fill="#30D158" opacity=".82"/>
    <rect x="340" y="290" width="48" height="48" rx="16" fill="#30D158" opacity=".92"/>
    <rect x="340" y="236" width="48" height="48" rx="16" fill="#30D158"/>
    <rect x="391" y="233" width="54" height="54" rx="18" fill="#30D158"/>
    <!-- eyes looking right -->
    <rect x="426" y="243" width="9" height="9" rx="4.5" fill="#000"/>
    <rect x="426" y="266" width="9" height="9" rx="4.5" fill="#000"/>
    <!-- next food -->
    <circle cx="478" cy="260" r="12" fill="#FF9F0A"/>
  </g>
</svg>
